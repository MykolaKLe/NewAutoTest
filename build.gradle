plugins {
    id 'java'
    id 'application'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.seleniumhq.selenium:selenium-java:4.40.0")
    implementation("org.testng:testng:7.11.0")
    implementation("io.github.bonigarcia:webdrivermanager:6.3.4")
    implementation("ch.qos.logback:logback-classic:1.6.3")
}

application {
    mainClass = 'ringotel.app.RingotelTestRunnerApp'
}

def configureRingotelProperties(Test testTask) {

    def properties = [
            'ringotel.domain': 'RINGOTEL_DOMAIN',
            'ringotel.user1' : 'RINGOTEL_USER_1',
            'ringotel.pass1' : 'RINGOTEL_PASS_1',
            'ringotel.user2' : 'RINGOTEL_USER_2',
            'ringotel.pass2' : 'RINGOTEL_PASS_2'
    ]

    properties.each { systemName, environmentName ->

        def value =
                System.getenv(environmentName)

        if (value != null && !value.isBlank()) {

            testTask.systemProperty(
                    systemName,
                    value
            )
        }
    }
}

test {
    useTestNG()

    configureRingotelProperties(delegate)

    if (project.hasProperty('browser')) {
        systemProperty 'browser', "${browser}"
    }

    testLogging {
        events "passed", "failed", "skipped"
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

task qa(type: Test) {

    useTestNG()

    configureRingotelProperties(delegate)

    if (project.hasProperty('browser')) {
        systemProperty 'browser', "${browser}"
    }

    testLogging {
        events "passed", "failed", "skipped"
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

def registerTask(
        String taskName,
        String suitePath
) {

    tasks.register(
            taskName,
            Test
    ) {

        testClassesDirs =
                sourceSets.test.output.classesDirs

        classpath =
                sourceSets.test.runtimeClasspath

        useTestNG() {
            suites suitePath
        }

        configureRingotelProperties(delegate)

        if (project.hasProperty('browser')) {
            systemProperty 'browser', "${browser}"
        }

        testLogging {
            events "passed", "failed", "skipped"
            showStandardStreams = true
            exceptionFormat = 'full'
        }
    }
}

registerTask(
        'quick',
        'src/test/resources/quick.xml'
)

registerTask(
        'regr',
        'src/test/resources/regression.xml'
)